<script type="text/x-dc" data-dc-script>
function formatBRL(n) {
  return Math.abs(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MESES_ABREV = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

// Cores do donut por slug; categoria criada pela família entra no ciclo
// das cores restantes, para o gráfico nunca ficar monocromático.
const CAT_CORES = {
  casa: 'var(--cat-casa)', carro: 'var(--cat-carro)', pessoal: 'var(--cat-pessoal)',
  divida: 'var(--cat-divida)', futuro: 'var(--cat-futuro)', outros: 'var(--cat-outros)',
};
const CICLO_CORES = ['var(--cat-casa)', 'var(--cat-carro)', 'var(--cat-pessoal)', 'var(--cat-divida)', 'var(--cat-futuro)', 'var(--cat-outros)'];

function iso(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function mesAtualPeriod() {
  const d = new Date();
  return { mode: 'mes', month: d.getMonth(), year: d.getFullYear(), label: MESES[d.getMonth()] + ' ' + d.getFullYear() };
}
function diasAte(isoData) {
  const [y, m, d] = isoData.split('-').map(Number);
  const alvo = new Date(y, m - 1, d);
  const hoje = new Date();
  hoje.setHours(0, 0, 0, 0);
  return Math.round((alvo - hoje) / 86400000);
}
function diaMesCurto(isoData) {
  const [y, m, d] = isoData.split('-').map(Number);
  return String(d).padStart(2, '0') + ' ' + MESES_ABREV[m - 1].toLowerCase();
}


class Component extends DCLogic {
  state = {
    isDesktop: typeof window !== 'undefined' ? window.innerWidth >= 900 : true,
    menuAberto: false,
    period: mesAtualPeriod(),
    entradas: [], saidas: [], dividas: [], cofrinhos: [], faturas: [], boletos: [],
    historico: [],
    caixa: null,
    casaNome: '',
    erro: '',
  };

  componentDidMount() {
    this.onResize = () => this.setState({ isDesktop: window.innerWidth >= 900 });
    window.addEventListener('resize', this.onResize);
    this.carregar();
    this.pararEscuta = Casa.aoMudar(['entradas', 'saidas', 'dividas', 'cofrinhos', 'cartoes'], () => this.carregar());
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    this.pararEscuta && this.pararEscuta();
  }

  async carregar() {
    if (!(await Casa.auth.exigirSessao())) return;
    try {
      // Qual casa está logada: o PIN do login decide, e o cabeçalho mostra.
      if (!this.state.casaNome) {
        const casa = await Casa.casaAtual();
        this.setState({ casaNome: casa.nome });
      }
      // Janela dos boletos: o que venceu há pouco e o que vence logo.
      // Sem isso um boleto atrasado só apareceria na aba Faturas.
      const hojeD = new Date();
      const de = iso(new Date(hojeD.getFullYear(), hojeD.getMonth(), hojeD.getDate() - 60));
      const ate = iso(new Date(hojeD.getFullYear(), hojeD.getMonth(), hojeD.getDate() + 7));

      const [entradas, saidas, dividas, cofrinhos, faturas, boletos, caixa] = await Promise.all([
        Casa.entradas.doPeriodo(this.state.period),
        Casa.saidas.doPeriodo(this.state.period),
        Casa.dividas.listar(),
        Casa.cofrinhos.listar(),
        Casa.faturas.listar(),
        Casa.saidas.boletos(de, ate),
        // caixa, a pagar e projetado saem do banco: a tela fazendo essa
        // conta por fora viraria um segundo número divergente do relatório
        Casa.caixaResumo(),
      ]);
      this.setState({ entradas, saidas, dividas, cofrinhos, faturas, boletos, caixa, erro: '' });
      this.carregarHistorico();
    } catch (e) {
      this.setState({ erro: e.message });
    }
  }

  /** Seis meses de entradas e saídas para as barras comparativas. */
  async carregarHistorico() {
    try {
      const hoje = new Date();
      const inicio = new Date(hoje.getFullYear(), hoje.getMonth() - 5, 1);
      const fim = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
      const faixa = { mode: 'periodo', startDate: iso(inicio), endDate: iso(fim) };

      const [ents, sais] = await Promise.all([
        Casa.entradas.doPeriodo(faixa),
        Casa.saidas.doPeriodo(faixa),
      ]);

      const buckets = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
        buckets.push({ chave: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'), label: MESES_ABREV[d.getMonth()], inVal: 0, outVal: 0 });
      }
      const porChave = {};
      buckets.forEach(b => { porChave[b.chave] = b; });

      // Mesmo recorte do saldo: só o que passou pela conta.
      ents.filter(e => !e.carteira_id)
          .forEach(e => { const b = porChave[e.data.slice(0, 7)]; if (b) b.inVal += Number(e.valor); });
      sais.filter(e => e.forma_pagamento !== 'vr' && !e.carteira_id)
          .forEach(e => { const b = porChave[e.data.slice(0, 7)]; if (b) b.outVal += Number(e.valor); });

      this.setState({ historico: buckets });
    } catch (e) {
      this.setState({ erro: e.message });
    }
  }

  renderVals() {
    const s = this.state;

    // Benefício é dinheiro de uso restrito e não fica na conta: crédito de
    // vale e gasto no cartão de vale ficam de fora do saldo e da renda
    // comprometida. O saldo aqui é o que dá para usar em qualquer coisa.
    const entradasConta = s.entradas.filter(e => !e.carteira_id);
    const saidasConta = s.saidas.filter(e => e.forma_pagamento !== 'vr' && !e.carteira_id);

    const totalEntradas = entradasConta.reduce((t, e) => t + Number(e.valor), 0);
    const totalSaidas = saidasConta.reduce((t, e) => t + Number(e.valor), 0);
    const saldo = totalEntradas - totalSaidas;

    /* Dois números diferentes, e misturá-los era o problema:
         saldo    — quanto sobrou NO PERÍODO filtrado (ainda usado para a
                    barra de renda comprometida, que é sobre o mês)
         caixa    — quanto dinheiro EXISTE hoje, venha de qual mês vier  */
    const c = s.caixa || {};
    const caixa = Number(c.saldo_caixa || 0);
    const temContas = Number(c.qtd_contas || 0) > 0;
    const aPagar = Number(c.a_pagar || 0);
    const vencido = Number(c.vencido || 0);
    const faturasAbertas = Number(c.faturas_abertas || 0);
    const aRevisar = Number(c.a_revisar || 0);
    const projetado = Number(c.saldo_projetado || 0);

    const pctComprometida = totalEntradas > 0
      ? Math.min(100, Math.round((totalSaidas / totalEntradas) * 100))
      : 0;
    const progressTone = pctComprometida > 90 ? 'alert' : pctComprometida > 70 ? 'accent' : 'primary';

    // saídas por categoria, para o donut
    const porCat = {};
    saidasConta.forEach(e => {
      const nome = (e.categorias && e.categorias.nome) || 'Sem categoria';
      const slug = (e.categorias && e.categorias.slug) || null;
      if (!porCat[nome]) porCat[nome] = { label: nome, slug: slug, value: 0 };
      porCat[nome].value += Number(e.valor);
    });
    const catList = Object.keys(porCat).map(k => porCat[k]).sort((a, b) => b.value - a.value);

    /* Barras ordenadas no lugar da rosca. A rosca é boa para parte-do-todo
       num relance, mas aqui a pergunta é "em que eu gastei MAIS" — e
       comparar fatias de ângulo parecido é justamente o que ela faz pior.
       Uma cor só para todas: o comprimento já diz quem é maior, e
       escurecer a maior codificaria o mesmo dado duas vezes. */
    const porCategoria = catList.slice(0, 7).map(c => ({ nome: c.label, valor: c.value }));

    const evolucao = s.historico.map(m => ({
      rotulo: m.label, entradas: m.inVal, saidas: m.outVal,
    }));

    const emAberto = s.dividas.filter(d => !d.quitada && Number(d.saldo_atual) > 0);
    const debts = emAberto.map((d, i) => {
      const parcela = Number(d.valor_parcela) || 0;
      const pago = Math.max(0, Number(d.valor_total) - Number(d.saldo_atual));
      const pagas = parcela > 0 ? Math.round(pago / parcela) : 0;
      return {
        title: d.nome,
        meta: d.parcelas_total ? `Parcela ${Math.min(pagas + 1, d.parcelas_total)}/${d.parcelas_total}` : 'Saldo devedor',
        amount: Number(d.saldo_atual),
        divider: i < emAberto.length - 1,
      };
    });

    // Só entra na barra quem tem meta: sem meta não há progresso a mostrar,
    // e o ProgressBar devolvia NaN%. O total guardado continua somando todos.
    const goals = s.cofrinhos
      .filter(c => c.meta_valor != null && Number(c.meta_valor) > 0)
      .map(c => ({
        label: c.nome,
        current: Number(c.saldo_atual),
        target: Number(c.meta_valor),
      }));

    /* Faturas que ainda vão vencer, da mais próxima para a mais distante.
       Fatura sem lançamento nenhum fica de fora: "Cartão Inter · R$ 0,00"
       ocupa uma linha para dizer que não há nada a pagar — é ruído com
       cara de cobrança. */
    const hojeISO = iso(new Date());
    const aVencer = s.faturas
      .filter(f => f.vencimento >= hojeISO && Number(f.total) > 0)
      .sort((a, b) => a.vencimento.localeCompare(b.vencimento));
    const faturas = aVencer.map((f, i) => {
      const dias = diasAte(f.vencimento);
      return {
        title: 'Cartão ' + f.cartao_nome,
        meta: (dias === 0 ? 'Vence hoje' : dias === 1 ? 'Vence amanhã' : `Vence em ${dias} dias`) + ' · ' + diaMesCurto(f.vencimento),
        amount: Number(f.total),
        divider: i < aVencer.length - 1,
      };
    });

    const alerts = [];

    /* Boleto vencido vem primeiro: é o que custa juros. Só o que ainda
       está em aberto — conta já paga aparecendo como pendência é o jeito
       mais rápido de a família parar de confiar no alerta. O que está
       marcado para revisão também fica fora: é palpite do próprio
       sistema sobre histórico antigo, e alarmar sobre ele seria alarmar
       sobre uma dúvida que ele mesmo criou. */
    s.boletos.filter(b => !b.cancelado && !b.revisar
                          && (b.status === 'pendente' || b.status === 'parcial')).forEach(b => {
      const nome = (b.categorias && b.categorias.nome) || 'Boleto';
      const dias = diasAte(b.vencimento);
      if (dias < 0) {
        alerts.push(`Boleto de ${nome} venceu ${dias === -1 ? 'ontem' : 'há ' + Math.abs(dias) + ' dias'}`);
      } else if (dias <= 7) {
        alerts.push(`Boleto de ${nome} vence ${dias === 0 ? 'hoje' : dias === 1 ? 'amanhã' : 'em ' + dias + ' dias'}`);
      }
    });

    aVencer.forEach(f => {
      const diasFecha = diasAte(f.fechamento);
      const diasVence = diasAte(f.vencimento);
      if (diasFecha >= 0 && diasFecha <= 3) {
        alerts.push(`Fatura ${f.cartao_nome} fecha ${diasFecha === 0 ? 'hoje' : 'em ' + diasFecha + ' dia(s)'}`);
      }
      if (diasVence >= 0 && diasVence <= 7) {
        alerts.push(`Cartão ${f.cartao_nome} vence ${diasVence === 0 ? 'hoje' : 'em ' + diasVence + ' dia(s)'}`);
      }
    });

    if (aRevisar > 0) {
      alerts.push(`R$ ${formatBRL(aRevisar)} em lançamentos antigos esperando você confirmar se foram pagos`);
    }

    return {
      isDesktop: s.isDesktop,
      casaNome: s.casaNome,
      contentPadding: s.isDesktop ? '28px 32px 40px' : '20px 16px 24px',
      period: s.period,
      onPeriodChange: (next) => this.setState({ period: next }, () => this.carregar()),
      menuAberto: this.state.menuAberto,
      erro: this.state.erro,
      onAbrirMenu: () => this.setState({ menuAberto: true }),
      onFecharMenu: () => this.setState({ menuAberto: false }),
      // o mapa de destinos mora no app/nav.js: com dois ambientes, uma
      // cópia por tela viraria dezesseis para esquecer de atualizar
      onNavigate: (id) => window.CasaNav.irPara(id),
      onSettings: () => { window.location.href = 'Configurações.dc.html'; },
      onRecarregar: () => this.carregar(),
      colunasKpi: s.isDesktop ? 'repeat(3, minmax(0,1fr))' : '1fr',
      colunasPar: s.isDesktop ? 'repeat(2, minmax(0,1fr))' : '1fr',

      /* O número da frente passou a ser o CAIXA, não o resultado do mês.
         Eram coisas diferentes com o mesmo nome: entradas menos saídas do
         período é quanto sobrou no mês, e mostrar isso como "saldo em
         conta" prometia um dinheiro que pode já estar comprometido.
         formatBRL usa Math.abs, então o sinal vem à parte — sem isso um
         saldo de -500 aparecia igualzinho a um positivo. */
      saldoTexto: (caixa < 0 ? '- R$ ' : 'R$ ') + formatBRL(caixa),
      saldoCor: caixa < 0 ? 'var(--color-alert)' : 'var(--text-primary)',
      /* Sem conta cadastrada o número é outro — "entrou menos saiu desde
         que vocês usam o app" —, e a legenda precisa dizer isso, senão a
         pessoa lê como o saldo do banco dela. */
      saldoLegenda: temContas
        ? (caixa < 0 ? 'Saldo em caixa, negativo' : 'Saldo em caixa hoje')
        : (caixa < 0
            ? 'Negativo: saiu mais do que entrou desde que vocês usam o app'
            : 'Entrou menos saiu desde que vocês usam o app'),

      aPagarTexto: 'R$ ' + formatBRL(aPagar),
      aPagarCor: vencido > 0 ? 'var(--color-alert)' : 'var(--text-primary)',
      aPagarDetalhe: vencido > 0 ? 'R$ ' + formatBRL(vencido) + ' já vencido' : 'nada vencido',
      faturasTexto: 'R$ ' + formatBRL(faturasAbertas),
      faturasDetalhe: faturasAbertas > 0 ? 'cartões a pagar' : 'nenhuma em aberto',
      projetadoTexto: (projetado < 0 ? '- R$ ' : 'R$ ') + formatBRL(Math.abs(projetado)),
      projetadoCor: projetado < 0 ? 'var(--color-alert)' : 'var(--text-primary)',
      pctComprometida,
      progressTone,
      progressCaption: `${pctComprometida}% da renda já comprometida este mês`,
      // O card lista todas as dívidas em aberto, não as "3 maiores" que o
      // protótipo prometia; o subtítulo passa a dizer o que está na tela.
      dividasSubtitulo: emAberto.length === 0 ? 'nenhuma em aberto'
        : emAberto.length === 1 ? '1 em aberto' : emAberto.length + ' em aberto',
      futuroSubtitulo: s.cofrinhos.length === 1 ? '1 cofrinho' : s.cofrinhos.length + ' cofrinhos',
      porCategoria,
      temCategorias: porCategoria.length > 0,
      evolucao,
      seriesEvolucao: [
        { chave: 'entradas', nome: 'Entradas', cor: 'var(--serie-1)' },
        { chave: 'saidas', nome: 'Saídas', cor: 'var(--serie-4)' },
      ],
      debts,
      debtsTotalFormatted: formatBRL(emAberto.reduce((t, d) => t + Number(d.saldo_atual), 0)),
      goals,
      futuroTotalFormatted: formatBRL(s.cofrinhos.reduce((t, c) => t + Number(c.saldo_atual), 0)),
      faturas,
      /* O subtítulo dizia "Vencimento em até 7 dias" e a lista mostrava
         fatura para dali a 23 dias. Agora ele conta o que está na tela. */
      temFaturas: faturas.length > 0,
      faturasSubtitulo: faturas.length === 0 ? 'Nenhuma em aberto'
        : faturas.length === 1 ? '1 a vencer' : faturas.length + ' a vencer',
      alerts,
      /* Cartão de alerta vazio é um retângulo em branco com título — o
         vazio precisa dizer alguma coisa, e aqui ele diz a melhor delas. */
      temAlertas: alerts.length > 0,
      alertasSubtitulo: alerts.length === 0 ? 'Tudo em dia' : 'Fique de olho',
    };
  }
}
</script>
</body>
</html>
