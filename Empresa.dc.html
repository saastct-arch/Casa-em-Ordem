<script type="text/x-dc" data-dc-script>
/* Painel da empresa.
 *
 * O que esta tela não faz, de propósito: somar entrada menos saída do mês
 * e chamar aquilo de saldo. São perguntas diferentes e a resposta errada
 * promete dinheiro que não existe.
 *
 *   saldo em caixa  — o que existe hoje
 *   a receber/pagar — o que ainda vai se mexer
 *   saldo projetado — os dois juntos
 *   resultado       — só o que de fato entrou e saiu no período
 *
 * Todos os números vêm do banco (`caixa_resumo`), não de uma soma feita
 * aqui: a mesma conta em dois lugares vira duas contas diferentes.
 */
const UI = () => window.CasaUI;

const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function mesAtualPeriod() {
  const d = new Date();
  return { mode: 'mes', month: d.getMonth(), year: d.getFullYear(), label: `${MESES[d.getMonth()]} ${d.getFullYear()}` };
}
const num = (v) => Number(v || 0);

class Component extends DCLogic {
  state = {
    isDesktop: typeof window !== 'undefined' ? window.innerWidth >= 900 : true,
    menuAberto: false,
    period: mesAtualPeriod(),
    casaNome: '',
    caixa: null,
    entradas: [],
    saidas: [],
    aPagar: [],
    aReceber: [],
    hoje: '',
    historico: [],
    erro: '',
  };

  componentDidMount() {
    this.onResize = () => this.setState({ isDesktop: window.innerWidth >= 900 });
    window.addEventListener('resize', this.onResize);
    // Esta tela é do ambiente empresarial: o resto da camada de dados passa
    // a filtrar por ele a partir daqui.
    if (window.Casa && Casa.ambiente) Casa.ambiente.definir('pj');
    this.carregar();
    this.pararEscuta = Casa.aoMudar(
      ['entradas', 'saidas', 'pagamentos', 'recebimentos', 'contas', 'transferencias'],
      () => this.carregar());
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    this.pararEscuta && this.pararEscuta();
  }

  async carregar() {
    if (!(await Casa.auth.exigirSessao())) return;
    try {
      if (!this.state.casaNome) {
        const casa = await Casa.casaAtual();
        // Sem permissão de PJ não há o que mostrar aqui. Quem barra de
        // verdade é a RLS — isto só evita a tela vazia e sem explicação.
        if (!casa.pode_pj) { window.location.href = 'Resumo.dc.html'; return; }
        this.setState({ casaNome: casa.nome });
      }

      const [caixa, entradas, saidas, hoje] = await Promise.all([
        Casa.caixaResumo(),
        Casa.entradas.doPeriodo(this.state.period),
        Casa.saidas.doPeriodo(this.state.period),
        Casa.hoje(),
      ]);

      // Em aberto é o que ainda vai se mexer — fora do período, porque uma
      // conta vencida em agosto continua sendo um problema em outubro.
      const [aPagar, aReceber] = await Promise.all([
        Casa.saidas.listar({ /* todas */ }),
        Casa.entradas.listar({}),
      ]);

      this.carregarHistorico();
      this.setState({
        caixa, entradas, saidas, hoje, erro: '',
        aPagar: (aPagar || []).filter(s =>
          !s.cancelado && !s.revisar && (s.status === 'pendente' || s.status === 'parcial')),
        aReceber: (aReceber || []).filter(e =>
          !e.cancelado && (e.status === 'previsto' || e.status === 'parcial')),
      });
    } catch (e) {
      this.setState({ erro: e.message });
    }
  }

  /* Seis meses de realizado, numa consulta só. Um pedido por mês seriam
     doze idas ao servidor para desenhar um gráfico. */
  async carregarHistorico() {
    try {
      const hoje = new Date();
      const inicio = new Date(hoje.getFullYear(), hoje.getMonth() - 5, 1);
      const fim = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
      const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')
                       + '-' + String(d.getDate()).padStart(2, '0');
      const janela = { mode: 'periodo', startDate: iso(inicio), endDate: iso(fim) };
      const [ent, sai] = await Promise.all([
        Casa.entradas.doPeriodo(janela),
        Casa.saidas.doPeriodo(janela),
      ]);

      const meses = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(hoje.getFullYear(), hoje.getMonth() - i, 1);
        meses.push({
          chave: d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'),
          rotulo: ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][d.getMonth()],
          recebido: 0, pago: 0,
        });
      }
      const achar = (data) => meses.find(m => String(data || '').slice(0, 7) === m.chave);
      // Realizado, não lançado: a data que importa é a do dinheiro.
      (ent || []).forEach(e => { const m = achar(e.data_recebimento || e.data);
        if (m) m.recebido += Number(e.valor_recebido || 0); });
      (sai || []).forEach(x => { const m = achar(x.data_pagamento || x.data);
        if (m) m.pago += Number(x.valor_pago || 0); });
      this.setState({ historico: meses });
    } catch (e) { /* o gráfico some, a tela continua */ }
  }

  renderVals() {
    const s = this.state;
    const ui = UI();
    const brl = ui ? ui.brl : (v) => 'R$ ' + num(v).toFixed(2);
    const c = s.caixa || {};

    // --- o que existe e o que ainda vai se mexer ---------------------
    const caixa = num(c.saldo_caixa);
    const aReceber = num(c.a_receber);
    const aPagar = num(c.a_pagar);
    const vencido = num(c.vencido);
    const faturas = num(c.faturas_abertas);
    const aRevisar = num(c.a_revisar);
    const projetado = num(c.saldo_projetado);

    // --- o que de fato se mexeu no período ---------------------------
    // Recebido e pago, não lançado: é a diferença entre o resultado e uma
    // promessa.
    const recebido = s.entradas.reduce((t, e) => t + num(e.valor_recebido), 0);
    const pago = s.saidas.reduce((t, x) => t + num(x.valor_pago), 0);
    const lancadoEntradas = s.entradas.reduce((t, e) => t + num(e.valor), 0);
    const lancadoSaidas = s.saidas.reduce((t, x) => t + num(x.valor), 0);
    const resultado = recebido - pago;

    const alertas = [];
    if (vencido > 0) alertas.push({
      icone: 'triangle-alert', texto: 'Contas vencidas e ainda não pagas',
      valor: brl(vencido), cor: 'var(--color-alert)', fundo: 'var(--color-alert-soft)',
    });
    if (faturas > 0) alertas.push({
      icone: 'receipt-text', texto: 'Faturas de cartão em aberto',
      valor: brl(faturas), cor: 'var(--gold-700)', fundo: 'var(--color-accent-soft)',
    });
    if (aRevisar > 0) alertas.push({
      icone: 'help-circle', texto: 'Lançamentos antigos esperando confirmação de pagamento',
      valor: brl(aRevisar), cor: 'var(--gold-700)', fundo: 'var(--color-accent-soft)',
    });

    const quando = (venc) => {
      if (!venc) return 'sem vencimento';
      if (!s.hoje) return 'vence em ' + (ui ? ui.data(venc) : venc);
      if (venc < s.hoje) return 'venceu em ' + (ui ? ui.data(venc) : venc);
      if (venc === s.hoje) return 'vence hoje';
      return 'vence em ' + (ui ? ui.data(venc) : venc);
    };
    const seloDe = (linha, pago) => {
      if (!pago && Casa.vencida(linha, s.hoje)) return 'vencida';
      return linha.status;
    };

    // Para onde o dinheiro foi: barras ordenadas. Uma cor só para todas —
    // escurecer a maior codificaria duas vezes o que o comprimento já diz.
    const porCat = new Map();
    s.saidas.forEach(x => {
      if (x.cancelado) return;
      const nome = (x.categorias && x.categorias.nome) || 'Sem categoria';
      porCat.set(nome, (porCat.get(nome) || 0) + num(x.valor));
    });
    const porCategoria = [...porCat.entries()]
      .map(([nome, valor]) => ({ nome, valor }))
      .sort((a, b) => b.valor - a.valor)
      .slice(0, 7);

    const ordenaPorVencimento = (a, b) =>
      String(a.vencimento || '9999').localeCompare(String(b.vencimento || '9999'));

    const contasAPagar = s.aPagar.slice().sort(ordenaPorVencimento).slice(0, 6).map(x => ({
      descricao: x.descricao,
      quando: quando(x.vencimento),
      valor: brl(num(x.saldo)),
      selo: seloDe(x, false),
    }));
    const listaAReceber = s.aReceber.slice().sort(ordenaPorVencimento).slice(0, 6).map(e => ({
      descricao: e.descricao,
      quando: quando(e.vencimento),
      valor: brl(num(e.saldo)),
      selo: e.status,
    }));

    const plural = (n, um, muitos) => n === 1 ? `1 ${um}` : `${n} ${muitos}`;

    return {
      isDesktop: s.isDesktop,
      menuAberto: s.menuAberto,
      period: s.period,
      casaNome: s.casaNome,
      erro: s.erro,
      contentPadding: s.isDesktop ? '28px 32px 40px' : '16px 16px 32px',
      colunasKpi: s.isDesktop ? 'repeat(4, minmax(0,1fr))' : 'repeat(2, minmax(0,1fr))',
      colunasResultado: s.isDesktop ? 'repeat(3, minmax(0,1fr))' : '1fr',
      colunasListas: s.isDesktop ? 'repeat(2, minmax(0,1fr))' : '1fr',

      caixaTexto: brl(caixa),
      caixaCor: caixa < 0 ? 'var(--color-alert)' : 'var(--text-primary)',
      caixaDetalhe: c.qtd_contas > 0
        ? plural(c.qtd_contas, 'conta cadastrada', 'contas cadastradas')
        : 'entrou menos saiu — cadastre uma conta para partir do saldo real',

      aReceberTexto: brl(aReceber),
      aReceberDetalhe: plural(s.aReceber.length, 'cobrança em aberto', 'cobranças em aberto'),

      aPagarTexto: brl(aPagar),
      aPagarCor: vencido > 0 ? 'var(--color-alert)' : 'var(--text-primary)',
      aPagarDetalhe: vencido > 0 ? brl(vencido) + ' já vencido'
                                 : plural(s.aPagar.length, 'conta em aberto', 'contas em aberto'),

      projetadoTexto: brl(projetado),
      projetadoCor: projetado < 0 ? 'var(--color-alert)' : 'var(--text-primary)',

      resultadoSubtitulo: 'Só o dinheiro que se mexeu · ' + (s.period.label || ''),
      recebidoTexto: brl(recebido),
      recebidoDetalhe: lancadoEntradas > recebido
        ? brl(lancadoEntradas - recebido) + ' ainda previsto' : 'tudo recebido',
      pagoTexto: brl(pago),
      pagoDetalhe: lancadoSaidas > pago
        ? brl(lancadoSaidas - pago) + ' ainda em aberto' : 'tudo pago',
      resultadoTexto: (resultado < 0 ? '- ' : '') + brl(Math.abs(resultado)),
      resultadoCor: resultado < 0 ? 'var(--color-alert)' : 'var(--money-in)',

      alertas,
      temAlertas: alertas.length > 0,

      evolucao: s.historico,
      temEvolucao: s.historico.some(m => m.recebido > 0 || m.pago > 0),
      seriesEvolucao: [
        { chave: 'recebido', nome: 'Recebido', cor: 'var(--serie-1)' },
        { chave: 'pago', nome: 'Pago', cor: 'var(--serie-4)' },
      ],
      evolucaoSubtitulo: 'Realizado nos últimos 6 meses',

      porCategoria,
      temCategorias: porCategoria.length > 0,
      categoriasSubtitulo: porCategoria.length
        ? 'Lançado em ' + (s.period.label || '') : (s.period.label || ''),


      contasAPagar,
      temContasAPagar: contasAPagar.length > 0,
      aPagarSubtitulo: s.aPagar.length > contasAPagar.length
        ? `as ${contasAPagar.length} mais próximas de ${s.aPagar.length}`
        : plural(s.aPagar.length, 'conta em aberto', 'contas em aberto'),

      listaAReceber,
      temAReceber: listaAReceber.length > 0,
      aReceberSubtitulo: s.aReceber.length > listaAReceber.length
        ? `as ${listaAReceber.length} mais próximas de ${s.aReceber.length}`
        : plural(s.aReceber.length, 'cobrança em aberto', 'cobranças em aberto'),

      onAbrirMenu: () => this.setState({ menuAberto: true }),
      onFecharMenu: () => this.setState({ menuAberto: false }),
      onNavigate: (id) => window.CasaNav.irPara(id),
      onSettings: () => { window.location.href = 'Configurações.dc.html'; },
      onRecarregar: () => this.carregar(),
      onPeriodChange: (p) => this.setState({ period: p }, () => this.carregar()),
    };
  }
}
</script>
</body>
</html>
