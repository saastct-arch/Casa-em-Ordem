<!doctype html>
<meta charset="utf-8">
<style>
  @font-face{font-family:'Fraunces';font-weight:400 900;
    src:url('../_ds/casa-em-ordem-design-system-c1605311-cb86-401f-a1cb-a53bd9162a8b/assets/fonts/Fraunces-Variable.woff2') format('woff2');}
  @font-face{font-family:'Source Sans 3';font-weight:400 700;
    src:url('../_ds/casa-em-ordem-design-system-c1605311-cb86-401f-a1cb-a53bd9162a8b/assets/fonts/SourceSans3-Variable.woff2') format('woff2');}
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#F7F5F1;display:flex;align-items:center;
       justify-content:center;overflow:hidden;position:relative}
  /* faixa verde discreta, como o cartão de total das telas */
  .faixa{position:absolute;left:0;right:0;bottom:0;height:10px;background:#0E6E5B}
  .halo{position:absolute;width:760px;height:760px;border-radius:50%;
        background:radial-gradient(circle,#D9EFE9 0%,rgba(217,239,233,0) 70%);
        top:-180px;right:-180px}
  .conteudo{display:flex;flex-direction:column;align-items:center;gap:28px;z-index:1}
  .marca{width:148px;height:148px}
  h1{font-family:'Fraunces';font-weight:800;font-size:76px;letter-spacing:-.015em;color:#22262B}
  p{font-family:'Source Sans 3';font-weight:400;font-size:28px;color:#3A3F46}
  .pilulas{display:flex;gap:12px;margin-top:6px}
  .pilula{font-family:'Source Sans 3';font-weight:600;font-size:20px;color:#0A5748;
          background:#D9EFE9;border-radius:999px;padding:10px 22px}
</style>
<div class="halo"></div>
<div class="conteudo">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="148" height="148" class="marca">
  <!-- Igual à tela de login: círculo --emerald-100 com a casinha
       --emerald-700. Usada na imagem de compartilhamento. -->
  <circle cx="32" cy="32" r="32" fill="#D9EFE9"/>
  <g transform="translate(13 13) scale(1.5833)"
     fill="none" stroke="#0E6E5B" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/>
    <path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
  </g>
</svg>
  <h1>Casa em Ordem</h1>
  <p>O controle financeiro da família, em um lugar só</p>
  <div class="pilulas">
    <span class="pilula">Entradas e saídas</span>
    <span class="pilula">Dívidas</span>
    <span class="pilula">Cofrinhos</span>
    <span class="pilula">Faturas</span>
  </div>
</div>
<div class="faixa"></div>
