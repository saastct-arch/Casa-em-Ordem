<script type="text/x-dc" data-dc-script>
function formatBRL(n) {
  return Math.abs(n || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
const MESES_LONGO = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function dateLabel(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return `${String(d).padStart(2, '0')} de ${MESES_LONGO[m - 1]}`;
}

const TIPO_META = {
  aporte: { label: 'Aporte', icon: 'plus', bg: 'var(--color-primary-soft)', fg: 'var(--color-primary)' },
  rendimento: { label: 'Rendimento', icon: 'trending-up', bg: 'var(--color-accent-soft)', fg: 'var(--gold-700)' },
  saque: { label: 'Saque', icon: 'arrow-down-left', bg: 'var(--cream-200)', fg: 'var(--text-secondary)' },
};

const NAV_MAP = { resumo: 'Resumo.dc.html', entradas: 'Entradas.dc.html', saidas: 'Saídas.dc.html', dividas: 'Dívidas.dc.html', futuro: 'Futuro.dc.html', faturas: 'Faturas.dc.html', beneficios: 'Benefícios.dc.html' };

class Component extends DCLogic {
  state = {
    isDesktop: typeof window !== 'undefined' ? window.innerWidth >= 900 : true,
    menuAberto: false,
    goals: [],
    historicos: {},
    formOpen: false, metaOpen: false,
    editingId: null,
    confirmDeleteId: null,
    resgatesDoCofrinho: 0,
    form: { nome: '', meta: 0 },
    openActionId: null, actionType: null, actionValue: 0,
    openHistoricoId: null,
    casaNome: '',
    erro: '',
  };

  componentDidMount() {
    this.onResize = () => this.setState({ isDesktop: window.innerWidth >= 900 });
    window.addEventListener('resize', this.onResize);
    this.carregar();
    // O saldo sobe sozinho quando alguém lança saída na categoria do
    // cofrinho, e cai no saque — por isso escuta saidas e entradas.
    this.pararEscuta = Casa.aoMudar(['cofrinhos', 'saidas', 'entradas'], () => this.carregar());
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.onResize);
    this.pararEscuta && this.pararEscuta();
  }

  async carregar() {
    if (!(await Casa.auth.exigirSessao())) return;
    try {
      // Qual casa está logada: o PIN do login decide, e o cabeçalho mostra.
      if (!this.state.casaNome) {
        const casa = await Casa.casaAtual();
        this.setState({ casaNome: casa.nome });
      }
      this.setState({ goals: await Casa.cofrinhos.listar(), erro: '' });
      if (this.state.openHistoricoId) this.carregarHistorico(this.state.openHistoricoId);
    } catch (e) {
      this.setState({ erro: e.message });
    }
  }

  async carregarHistorico(id) {
    try {
      const lista = await Casa.cofrinhos.historico(id);
      this.setState({ historicos: { ...this.state.historicos, [id]: lista } });
    } catch (e) {
      this.setState({ erro: e.message });
    }
  }

  toggleHistorico(g) {
    const abrindo = this.state.openHistoricoId !== g.id;
    this.setState({ openHistoricoId: abrindo ? g.id : null, openActionId: null });
    if (abrindo) this.carregarHistorico(g.id);
  }

  openAction(id, type) { this.setState({ openActionId: id, actionType: type, actionValue: 0, openHistoricoId: null }); }
  cancelAction() { this.setState({ openActionId: null, actionType: null, actionValue: 0 }); }

  async confirmAction(goal) {
    const { actionType, actionValue } = this.state;
    if (!actionValue) return this.cancelAction();
    try {
      if (actionType === 'rendimento') {
        // A tela pede o novo saldo; o banco guarda a diferença como
        // ajuste e a trigger reposiciona o saldo do cofrinho.
        const diff = actionValue - Number(goal.saldo_atual);
        if (diff !== 0) await Casa.cofrinhos.rendimento(goal.id, diff);
      } else {
        // Saque: reduz o cofrinho e cria a entrada "Resgate".
        const saque = Math.min(actionValue, Number(goal.saldo_atual));
        if (saque > 0) await Casa.cofrinhos.sacar(goal.id, saque);
      }
      this.setState({ openActionId: null, actionType: null, actionValue: 0, erro: '' });
      await this.carregar();
    } catch (e) {
      this.setState({ erro: e.message, openActionId: null, actionType: null, actionValue: 0 });
    }
  }

  async save() {
    const f = this.state.form;
    if (!f.nome) return;
    const campos = {
      nome: f.nome,
      meta_valor: this.state.metaOpen && f.meta > 0 ? f.meta : null,
    };
    try {
      if (this.state.editingId) await Casa.cofrinhos.atualizar(this.state.editingId, campos);
      else await Casa.cofrinhos.criar(campos);
      this.setState({ formOpen: false, metaOpen: false, editingId: null, form: { nome: '', meta: 0 }, erro: '' });
      await this.carregar();
    } catch (e) {
      this.setState({ erro: e.message });
    }
  }

  editar(g) {
    const meta = g.meta_valor == null ? 0 : Number(g.meta_valor);
    this.setState({
      editingId: g.id, formOpen: true, metaOpen: meta > 0, confirmDeleteId: null,
      openActionId: null, openHistoricoId: null,
      form: { nome: g.nome, meta: meta },
    });
  }

  fecharForm() {
    this.setState({ formOpen: false, metaOpen: false, editingId: null, form: { nome: '', meta: 0 } });
  }

  /**
   * O banco recusa apagar cofrinho que já teve saque: a entrada "Resgate"
   * ficaria sem cofrinho e quebra a constraint. Então checamos antes e
   * explicamos, em vez de deixar vazar o erro cru do Postgres.
   */
  async pedirExclusao(g) {
    try {
      const n = await Casa.cofrinhos.contarResgates(g.id);
      this.setState({ confirmDeleteId: g.id, resgatesDoCofrinho: n });
    } catch (e) {
      this.setState({ erro: e.message });
    }
  }

  async excluir(g) {
    try {
      await Casa.cofrinhos.excluir(g.id);
      this.setState({ confirmDeleteId: null });
      if (this.state.editingId === g.id) this.fecharForm();
      await this.carregar();
    } catch (e) {
      this.setState({ erro: e.message, confirmDeleteId: null });
    }
  }

  renderVals() {
    const s = this.state;
    const goals = s.goals.map(g => {
      const actionOpen = s.openActionId === g.id;
      const historicoOpen = s.openHistoricoId === g.id;
      const saldo = Number(g.saldo_atual);
      const meta = g.meta_valor == null ? null : Number(g.meta_valor);
      const confirmando = s.confirmDeleteId === g.id;
      const temResgate = confirmando && s.resgatesDoCofrinho > 0;
      return {
        onEdit: () => this.editar(g),
        onDelete: () => this.pedirExclusao(g),
        confirmingDelete: confirmando,
        podeExcluir: !temResgate,
        cancelLabel: temResgate ? 'Entendi' : 'Cancelar',
        deleteMsg: temResgate
          ? `"${g.nome}" tem ${s.resgatesDoCofrinho} saque(s) lançados em Entradas. Exclua esses resgates antes.`
          : `Excluir "${g.nome}"? O saldo guardado some junto.`,
        onConfirmDelete: () => this.excluir(g),
        onCancelDelete: () => this.setState({ confirmDeleteId: null }),
        nome: g.nome, saldo: saldo, meta: meta, hasMeta: !!meta,
        saldoFormatted: formatBRL(saldo),
        onRendimento: () => this.openAction(g.id, 'rendimento'),
        onSacar: () => this.openAction(g.id, 'saque'),
        onHistorico: () => this.toggleHistorico(g),
        actionOpen, actionLabel: s.actionType === 'rendimento' ? 'Novo saldo atual' : 'Valor a sacar',
        actionValue: actionOpen ? s.actionValue : 0,
        onActionValueChange: (v) => this.setState({ actionValue: v }),
        onConfirmAction: () => this.confirmAction(g),
        onCancelAction: () => this.cancelAction(),
        historicoOpen,
        historico: (s.historicos[g.id] || []).map(h => {
          const t = TIPO_META[h.tipo];
          const sign = h.tipo === 'saque' ? '− ' : '+ ';
          return {
            icon: t.icon, tipoLabel: t.label, dataLabel: dateLabel(h.data),
            iconWrapStyle: { width: 28, height: 28, borderRadius: 9, flexShrink: 0, background: t.bg, color: t.fg, display: 'flex', alignItems: 'center', justifyContent: 'center' },
            valorStyle: { fontFamily: 'var(--font-numeric)', fontFeatureSettings: 'var(--num-features)', fontSize: 13, fontWeight: 600, color: h.tipo === 'saque' ? 'var(--text-primary)' : 'var(--money-in)', whiteSpace: 'nowrap' },
            valorFormatted: sign + 'R$ ' + formatBRL(h.valor),
          };
        }),
      };
    });

    return {
      isDesktop: s.isDesktop,
      casaNome: s.casaNome,
      contentPadding: s.isDesktop ? '28px 32px 40px' : '20px 16px 24px',
      totalGeral: s.goals.reduce((sum, g) => sum + Number(g.saldo_atual), 0),
      formOpen: s.formOpen,
      // Janela flutuante: no celular sobe como folha pelo rodapé, no
      // desktop abre centrada. Antes o formulário ficava fixo na página e
      // empurrava gráficos e histórico para fora da primeira tela.
      overlayStyle: {
        position: 'fixed', inset: 0, zIndex: 60, background: 'rgba(34,38,43,0.45)',
        display: 'flex', justifyContent: 'center',
        alignItems: s.isDesktop ? 'center' : 'flex-end',
        padding: s.isDesktop ? 24 : 12, boxSizing: 'border-box', overflowY: 'auto',
      },
      modalStyle: {
        position: 'relative', width: '100%', maxWidth: 560,
        maxHeight: s.isDesktop ? '88vh' : '92vh', overflowY: 'auto',
      },
      onModalClick: (e) => e.stopPropagation(),
      onFecharForm: () => this.fecharForm(),

      formTitle: s.editingId ? 'Editar cofrinho' : 'Novo cofrinho',
      saveLabel: s.editingId ? 'Salvar alterações' : 'Criar cofrinho',
      toggleLabel: 'Novo cofrinho',
      toggleIcon: 'plus',
      onToggleForm: () => this.setState({ formOpen: true }),
      menuAberto: this.state.menuAberto,
      erro: this.state.erro,
      onAbrirMenu: () => this.setState({ menuAberto: true }),
      onFecharMenu: () => this.setState({ menuAberto: false }),
      onNavigate: (id) => { if (NAV_MAP[id]) window.location.href = NAV_MAP[id]; },
      onSettings: () => { window.location.href = 'Configurações.dc.html'; },
      form: s.form, metaOpen: s.metaOpen,
      onNomeChange: (v) => this.setState({ form: { ...s.form, nome: v } }),
      onOpenMeta: () => this.setState({ metaOpen: true }),
      onMetaChange: (v) => this.setState({ form: { ...s.form, meta: v } }),
      canSave: !!s.form.nome,
      onSave: () => this.save(),
      goals,
    };
  }
}
</script>
</body>
</html>
