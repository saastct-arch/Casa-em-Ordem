<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;display:inline-block;font-family:var(--font-body);">
  <button type="button" onClick="{{ onToggle }}" style="{{ triggerStyle }}">
    <x-import component-from-global-scope="CasaEmOrdemDesignSystem_c16053.Icon" name="calendar" size="16" hint-size="16px,16px"></x-import>
    <span>{{ label }}</span>
    <x-import component-from-global-scope="CasaEmOrdemDesignSystem_c16053.Icon" name="chevron-down" size="14" hint-size="14px,14px"></x-import>
  </button>

  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:15;" onClick="{{ onClose }}"></div>
    <div style="{{ panelStyle }}">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;">
        <button type="button" onClick="{{ onTabMes }}" style="{{ tabMesStyle }}">Mês</button>
        <button type="button" onClick="{{ onTabAno }}" style="{{ tabAnoStyle }}">Ano</button>
        <button type="button" onClick="{{ onTabPeriodo }}" style="{{ tabPeriodoStyle }}">Período</button>
      </div>

      <sc-if value="{{ isMes }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div style="display:flex;align-items:center;justify-content:center;gap:14px;">
            <x-import component-from-global-scope="CasaEmOrdemDesignSystem_c16053.IconButton" icon="chevron-left" label="Ano anterior" size="32" bordered="{{ true }}" on-click="{{ onYearPrev }}" hint-size="32px,32px"></x-import>
            <span style="font-family:var(--font-display);font-weight:700;font-size:17px;min-width:60px;text-align:center;color:var(--text-primary);">{{ tempYear }}</span>
            <x-import component-from-global-scope="CasaEmOrdemDesignSystem_c16053.IconButton" icon="chevron-right" label="Próximo ano" size="32" bordered="{{ true }}" on-click="{{ onYearNext }}" hint-size="32px,32px"></x-import>
          </div>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;">
            <sc-for list="{{ monthOptions }}" as="mo" hint-placeholder-count="12">
              <button type="button" onClick="{{ mo.onSelect }}" style="{{ mo.style }}">{{ mo.label }}</button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{ isAno }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:14px;align-items:center;">
          <div style="display:flex;align-items:center;justify-content:center;gap:16px;">
            <x-import component-from-global-scope="CasaEmOrdemDesignSystem_c16053.IconButton" icon="chevron-left" label="Ano anterior" size="36" bordered="{{ true }}" on-click="{{ onYearPrev }}" hint-size="36px,36px"></x-import>
            <span style="font-family:var(--font-display);font-weight:800;font-size:26px;min-width:90px;text-align:center;color:var(--text-primary);">{{ tempYear }}</span>
            <x-import component-from-global-scope="CasaEmOrdemDesignSystem_c16053.IconButton" icon="chevron-right" label="Próximo ano" size="36" bordered="{{ true }}" on-click="{{ onYearNext }}" hint-size="36px,36px"></x-import>
          </div>
          <x-import component-from-global-scope="CasaEmOrdemDesignSystem_c16053.Button" variant="primary" size="md" full-width="{{ true }}" on-click="{{ onApplyAno }}" hint-size="100%,40px">Ver ano inteiro</x-import>
        </div>
      </sc-if>

      <sc-if value="{{ isPeriodo }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <sc-for list="{{ presets }}" as="p" hint-placeholder-count="4">
              <button type="button" onClick="{{ p.onSelect }}" style="{{ p.style }}">{{ p.label }}</button>
            </sc-for>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <div style="display:flex;flex-direction:column;gap:4px;">
              <label style="font-size:12px;font-weight:600;color:var(--text-secondary);">De</label>
              <input type="date" value="{{ tempStart }}" onChange="{{ onStartChange }}" style="height:40px;padding:0 10px;border:1px solid var(--border-strong);border-radius:var(--radius-control);background:var(--surface-card);font-family:var(--font-body);font-size:13px;color:var(--text-primary);outline:none;"></input>
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;">
              <label style="font-size:12px;font-weight:600;color:var(--text-secondary);">Até</label>
              <input type="date" value="{{ tempEnd }}" onChange="{{ onEndChange }}" style="height:40px;padding:0 10px;border:1px solid var(--border-strong);border-radius:var(--radius-control);background:var(--surface-card);font-family:var(--font-body);font-size:13px;color:var(--text-primary);outline:none;"></input>
            </div>
          </div>
          <x-import component-from-global-scope="CasaEmOrdemDesignSystem_c16053.Button" variant="primary" size="md" full-width="{{ true }}" disabled="{{ !canApplyPeriodo }}" on-click="{{ onApplyPeriodo }}" hint-size="100%,40px">Aplicar período</x-import>
        </div>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:44},&quot;mode&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;'mes'|'ano'|'periodo'&quot;},&quot;month&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;year&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;label&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v:any)=&gt;void&quot;}}">
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MESES_ABREV = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

function fmtShort(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);
  return `${d} ${MESES_ABREV[m - 1]}`;
}
// Data local, não UTC: toISOString() volta um dia em fusos negativos.
function toISO(date) {
  return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
}
function addDays(date, n) { const d = new Date(date); d.setDate(d.getDate() + n); return d; }

class Component extends DCLogic {
  state = { open: false, tab: 'mes', tempYear: this.props.year ?? new Date().getFullYear(), tempStart: '', tempEnd: '' };

  toggle() { this.setState({ open: !this.state.open, tab: this.props.mode || 'mes', tempYear: this.props.year ?? this.state.tempYear }); }
  close() { this.setState({ open: false }); }

  selectMonth(m) {
    const year = this.state.tempYear;
    this.emit({ mode: 'mes', month: m, year, label: `${MESES[m]} ${year}` });
    this.setState({ open: false });
  }
  applyAno() {
    const year = this.state.tempYear;
    this.emit({ mode: 'ano', year, label: `${year}` });
    this.setState({ open: false });
  }
  applyPeriodo() {
    const { tempStart, tempEnd } = this.state;
    if (!tempStart || !tempEnd) return;
    this.emit({ mode: 'periodo', startDate: tempStart, endDate: tempEnd, label: `${fmtShort(tempStart)} – ${fmtShort(tempEnd)}` });
    this.setState({ open: false });
  }
  applyPreset(startDate, endDate) {
    this.setState({ tempStart: startDate, tempEnd: endDate });
  }
  emit(payload) { this.props.onChange && this.props.onChange(payload); }

  renderVals() {
    const s = this.state;
    const p = this.props;
    const mode = p.mode || 'mes';
    const label = p.label || `${MESES[p.month ?? new Date().getMonth()]} ${p.year ?? new Date().getFullYear()}`;

    // Presets a partir de hoje, não de uma data fixa do protótipo.
    const today = new Date();
    const y = today.getFullYear(), m = today.getMonth();
    const presets = [
      { label: 'Últimos 7 dias', range: [addDays(today, -6), today] },
      { label: 'Últimos 30 dias', range: [addDays(today, -29), today] },
      { label: 'Este mês', range: [new Date(y, m, 1), today] },
      { label: 'Mês passado', range: [new Date(y, m - 1, 1), new Date(y, m, 0)] },
    ].map(pr => ({
      label: pr.label,
      onSelect: () => this.applyPreset(toISO(pr.range[0]), toISO(pr.range[1])),
      style: { height: 30, padding: '0 12px', borderRadius: 'var(--radius-pill)', border: '1px solid var(--border-default)', background: 'var(--cream-100)', color: 'var(--text-secondary)', fontFamily: 'var(--font-body)', fontSize: 12, fontWeight: 600, cursor: 'pointer' },
    }));

    const monthOptions = MESES_ABREV.map((name, i) => {
      const active = mode === 'mes' && p.month === i && p.year === s.tempYear;
      return {
        label: name,
        onSelect: () => this.selectMonth(i),
        style: {
          height: 36, borderRadius: 'var(--radius-control)', border: 'none', cursor: 'pointer',
          fontFamily: 'var(--font-body)', fontSize: 13, fontWeight: 600,
          background: active ? 'var(--color-primary)' : 'var(--cream-200)',
          color: active ? '#fff' : 'var(--text-secondary)',
        },
      };
    });

    const tabStyle = (id) => ({
      height: 34, borderRadius: 'var(--radius-control)', border: 'none', cursor: 'pointer',
      fontFamily: 'var(--font-body)', fontSize: 13, fontWeight: 600,
      background: s.tab === id ? 'var(--color-primary-soft)' : 'var(--cream-200)',
      color: s.tab === id ? 'var(--emerald-800)' : 'var(--text-secondary)',
    });

    return {
      open: s.open,
      label,
      triggerStyle: {
        display: 'inline-flex', alignItems: 'center', gap: 8, height: 40, padding: '0 16px',
        border: '1px solid var(--border-strong)', borderRadius: 'var(--radius-pill)', background: 'var(--surface-card)',
        color: 'var(--text-primary)', fontFamily: 'var(--font-body)', fontSize: 13, fontWeight: 600, cursor: 'pointer',
      },
      panelStyle: {
        position: 'absolute', top: 'calc(100% + 8px)', right: 0, zIndex: 20, width: 300,
        background: 'var(--surface-card)', border: '1px solid var(--border-default)', borderRadius: 'var(--radius-card)',
        boxShadow: 'var(--shadow-raised)', padding: 16, display: 'flex', flexDirection: 'column', gap: 14,
      },
      onToggle: () => this.toggle(),
      onClose: () => this.close(),
      isMes: s.tab === 'mes', isAno: s.tab === 'ano', isPeriodo: s.tab === 'periodo',
      onTabMes: () => this.setState({ tab: 'mes' }),
      onTabAno: () => this.setState({ tab: 'ano' }),
      onTabPeriodo: () => this.setState({ tab: 'periodo' }),
      tabMesStyle: tabStyle('mes'), tabAnoStyle: tabStyle('ano'), tabPeriodoStyle: tabStyle('periodo'),
      tempYear: s.tempYear,
      onYearPrev: () => this.setState({ tempYear: s.tempYear - 1 }),
      onYearNext: () => this.setState({ tempYear: s.tempYear + 1 }),
      onApplyAno: () => this.applyAno(),
      monthOptions,
      presets,
      tempStart: s.tempStart, tempEnd: s.tempEnd,
      onStartChange: (e) => this.setState({ tempStart: e.target.value }),
      onEndChange: (e) => this.setState({ tempEnd: e.target.value }),
      canApplyPeriodo: !!(s.tempStart && s.tempEnd),
      onApplyPeriodo: () => this.applyPeriodo(),
    };
  }
}
</script>
</body>
</html>
