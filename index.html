<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<meta property="og:title" content="Casa em Ordem">

<meta property="og:url" content="https://casa-em-ordem-psi.vercel.app/">

</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/casa-em-ordem-design-system-c1605311-cb86-401f-a1cb-a53bd9162a8b/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/casa-em-ordem-design-system-c1605311-cb86-401f-a1cb-a53bd9162a8b/tokens/colors.css">
  <link rel="stylesheet" href="_ds/casa-em-ordem-design-system-c1605311-cb86-401f-a1cb-a53bd9162a8b/tokens/typography.css">
  <link rel="stylesheet" href="_ds/casa-em-ordem-design-system-c1605311-cb86-401f-a1cb-a53bd9162a8b/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/casa-em-ordem-design-system-c1605311-cb86-401f-a1cb-a53bd9162a8b/tokens/effects.css">
  <link rel="stylesheet" href="_ds/casa-em-ordem-design-system-c1605311-cb86-401f-a1cb-a53bd9162a8b/tokens/base.css">
  <link rel="stylesheet" href="_ds/casa-em-ordem-design-system-c1605311-cb86-401f-a1cb-a53bd9162a8b/styles.css">
  <script src="_ds/casa-em-ordem-design-system-c1605311-cb86-401f-a1cb-a53bd9162a8b/_ds_bundle.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@1,500;1,600&display=swap">
  <style>
    body{margin:0;}
    a{color:var(--color-primary);} a:hover{color:var(--color-primary-hover);}
    @keyframes dotPulse{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
    @keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  </style>
</helmet>

<sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
<div style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:var(--bg-app);padding:24px;box-sizing:border-box;font-family:var(--font-body);">
  <div style="width:100%;max-width:380px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:40px 32px;display:flex;flex-direction:column;align-items:center;gap:28px;">
    <div style="width:64px;height:64px;border-radius:50%;background:var(--color-primary-soft);display:flex;align-items:center;justify-content:center;">
      <x-import component-from-global-scope="CasaEmOrdemDesignSystem_c16053.Icon" name="house" size="30" color="var(--color-primary)" stroke-width="2" hint-size="30px,30px"></x-import>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;">
      <h1 style="margin:0;font-family:var(--font-display);font-weight:800;font-size:26px;letter-spacing:-0.02em;color:var(--text-primary);">Casa em Ordem</h1>
      <p style="margin:0;font-size:14px;color:var(--text-secondary);">{{ subtitulo }}</p>
    </div>
    <sc-if value="{{ pedindoSenha }}" hint-placeholder-val="{{ false }}">
      <div style="width:100%;display:flex;flex-direction:column;gap:10px;">
        <input ref="{{ senhaRef }}" type="password" value="{{ senha }}" onChange="{{ onSenhaChange }}" onKeyDown="{{ onSenhaKeyDown }}"
          autocomplete="current-password" aria-label="Senha da casa" placeholder="Senha"
          style="width:100%;box-sizing:border-box;height:52px;padding:0 16px;font-family:var(--font-body);font-size:16px;color:var(--text-primary);background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-control);outline:none;"
          style-focus="border-color:var(--color-primary);box-shadow:var(--focus-ring);"></input>
        <button type="button" onClick="{{ onVoltar }}" style="align-self:center;background:none;border:none;cursor:pointer;font-family:var(--font-body);font-size:13px;color:var(--text-secondary);text-decoration:underline;">Usar outro PIN</button>
      </div>
    </sc-if>
    <sc-if value="{{ !pedindoSenha }}" hint-placeholder-val="{{ true }}">
    <div style="{{ pinRowStyle }}">
      <sc-for list="{{ digits }}" as="d" hint-placeholder-count="4">
        <input ref="{{ d.ref }}" value="{{ d.value }}" onChange="{{ d.onChange }}" onKeyDown="{{ d.onKeyDown }}"
          type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="1" aria-label="Dígito da senha"
          style="width:52px;height:60px;text-align:center;font-family:var(--font-numeric);font-feature-settings:var(--num-features);font-size:26px;font-weight:600;color:var(--text-primary);background:var(--surface-card);border:1px solid var(--border-strong);border-radius:var(--radius-control);outline:none;transition:border-color var(--dur-fast) var(--ease-standard), box-shadow var(--dur-fast) var(--ease-standard);"
          style-focus="border-color:var(--color-primary);box-shadow:var(--focus-ring);"></input>
      </sc-for>
    </div>
    </sc-if>
    <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}">
      <span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;border-radius:var(--radius-pill);background:var(--color-alert-soft);color:var(--color-alert);font-size:13px;font-weight:600;">{{ errorMessage }}</span>
    </sc-if>
    <x-import component-from-global-scope="CasaEmOrdemDesignSystem_c16053.Button" variant="primary" size="lg" full-width="{{ true }}" disabled="{{ !canSubmit }}" on-click="{{ onSubmit }}" hint-size="100%,48px">{{ rotuloBotao }}</x-import>
  </div>
</div>
</sc-if>

<sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
<div style="{{ loadingStyle }}">
  <div style="max-width:640px;display:flex;flex-direction:column;align-items:center;gap:36px;text-align:center;">
    <p style="margin:0;font-family:'Lora',serif;font-style:italic;font-weight:500;font-size:clamp(22px,3.4vw,32px);line-height:1.45;color:var(--emerald-800);">
      "Na casa do sábio há comida e azeite armazenados,<br>mas o tolo devora tudo o que pode."
    </p>
    <p style="margin:0;font-family:var(--font-body);font-size:15px;color:var(--text-secondary);letter-spacing:0.01em;">— Provérbios 21:20</p>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <span style="width:9px;height:9px;border-radius:50%;background:var(--color-accent);display:inline-block;animation:dotPulse 1.2s ease-in-out infinite;animation-delay:0ms;"></span>
      <span style="width:9px;height:9px;border-radius:50%;background:var(--color-accent);display:inline-block;animation:dotPulse 1.2s ease-in-out infinite;animation-delay:160ms;"></span>
      <span style="width:9px;height:9px;border-radius:50%;background:var(--color-accent);display:inline-block;animation:dotPulse 1.2s ease-in-out infinite;animation-delay:320ms;"></span>
    </div>
  </div>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    view: 'login', pin: ['', '', '', ''], shake: false,
    error: false, errorMessage: '', checking: false, loadingOpacity: 0,
    // Casa que exige segunda senha: o PIN vira o primeiro de dois passos.
    pedindoSenha: false, senha: '', casaDaSenha: '',
  };
  inputRefs = [React.createRef(), React.createRef(), React.createRef(), React.createRef()];
  senhaRef = React.createRef();

  componentDidMount() {
    // Já entrou antes neste aparelho? Vai direto, sem pedir o PIN de novo.
    Casa.auth.temSessao().then((tem) => {
      if (tem) { window.location.replace('Resumo.dc.html'); return; }
      this.inputRefs[0].current && this.inputRefs[0].current.focus();
    });
  }

  handleChange(i, raw) {
    const digit = (raw || '').replace(/\D/g, '').slice(-1);
    const pin = [...this.state.pin];
    pin[i] = digit;
    this.setState({ pin, shake: false, error: false, errorMessage: '' });
    if (digit && i < 3) {
      const next = this.inputRefs[i + 1].current;
      next && next.focus();
    }
  }

  handleKeyDown(i, e) {
    if (e.key === 'Backspace' && !this.state.pin[i] && i > 0) {
      const prev = this.inputRefs[i - 1].current;
      prev && prev.focus();
    }
    if (e.key === 'Enter' && this.state.pin.every(d => d !== '')) {
      this.submit();
    }
  }

  recusar(mensagem) {
    if (this.state.pedindoSenha) {
      // Segunda senha errada: limpa só a senha e mantém o passo.
      this.setState({ shake: true, error: true, errorMessage: mensagem, senha: '', checking: false });
      setTimeout(() => this.setState({ shake: false }), 400);
      setTimeout(() => this.senhaRef.current && this.senhaRef.current.focus(), 0);
      return;
    }
    this.setState({ shake: true, error: true, errorMessage: mensagem, pin: ['', '', '', ''], checking: false });
    setTimeout(() => this.setState({ shake: false }), 400);
    setTimeout(() => this.inputRefs[0].current && this.inputRefs[0].current.focus(), 0);
  }

  voltarAoPin() {
    this.setState({
      pedindoSenha: false, senha: '', casaDaSenha: '',
      pin: ['', '', '', ''], error: false, errorMessage: '', checking: false,
    });
    setTimeout(() => this.inputRefs[0].current && this.inputRefs[0].current.focus(), 0);
  }

  async submit() {
    if (this.state.checking) return;
    if (this.state.pedindoSenha && !this.state.senha) {
      this.setState({ shake: true });
      setTimeout(() => this.setState({ shake: false }), 400);
      return;
    }
    if (!this.state.pedindoSenha && !this.state.pin.every(d => d !== '')) {
      this.setState({ shake: true });
      setTimeout(() => this.setState({ shake: false }), 400);
      return;
    }

    // PIN e senha são conferidos no servidor: a edge function devolve a
    // sessão da conta compartilhada. Nada de senha no navegador.
    this.setState({ checking: true, error: false, errorMessage: '' });
    let r;
    try {
      r = await Casa.auth.entrarComPin(this.state.pin.join(''), this.state.senha);
    } catch (e) {
      this.recusar(e.message || 'Não foi possível entrar.');
      return;
    }

    // Casa com segunda senha: o PIN bateu, falta a senha.
    if (r && r.precisaSenha) {
      this.setState({
        pedindoSenha: true, casaDaSenha: r.casa || '', checking: false,
        senha: '', error: !!r.erro, errorMessage: r.erro || '',
        shake: !!r.erro,
      });
      if (r.erro) setTimeout(() => this.setState({ shake: false }), 400);
      setTimeout(() => this.senhaRef.current && this.senhaRef.current.focus(), 0);
      return;
    }

    const FADE_MS = 900;
    const HOLD_MS = 6000;
    this.setState({ view: 'loading', checking: false, loadingOpacity: 0 });
    setTimeout(() => this.setState({ loadingOpacity: 1 }), 20);
    setTimeout(() => this.setState({ loadingOpacity: 0 }), FADE_MS + HOLD_MS);
    setTimeout(() => { window.location.replace('Resumo.dc.html'); }, FADE_MS + HOLD_MS + FADE_MS);
  }

  renderVals() {
    const pin = this.state.pin;
    const digits = pin.map((d, i) => ({
      value: d,
      ref: this.inputRefs[i],
      onChange: (e) => this.handleChange(i, e.target.value),
      onKeyDown: (e) => this.handleKeyDown(i, e),
    }));
    return {
      isLogin: this.state.view === 'login',
      isLoading: this.state.view === 'loading',
      digits,
      canSubmit: (this.state.pedindoSenha
        ? this.state.senha.length > 0
        : pin.every(d => d !== '')) && !this.state.checking,
      pedindoSenha: this.state.pedindoSenha,
      senha: this.state.senha,
      senhaRef: this.senhaRef,
      onSenhaChange: (e) => this.setState({ senha: e.target.value, error: false, errorMessage: '' }),
      onSenhaKeyDown: (e) => { if (e.key === 'Enter') this.submit(); },
      onVoltar: () => this.voltarAoPin(),
      subtitulo: this.state.pedindoSenha
        ? (this.state.casaDaSenha ? 'Senha de ' + this.state.casaDaSenha : 'Digite a senha da casa')
        : 'Digite a senha da família',
      rotuloBotao: this.state.pedindoSenha ? 'Confirmar' : 'Entrar',
      error: this.state.error,
      errorMessage: this.state.errorMessage,
      onSubmit: () => this.submit(),
      pinRowStyle: {
        display: 'flex', gap: 12,
        animation: this.state.shake ? 'shakeX 320ms ease' : 'none',
      },
      loadingStyle: {
        opacity: this.state.loadingOpacity,
        transition: 'opacity 900ms cubic-bezier(.2,0,0,1)',
        minHeight: '100vh', width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center',
        background: 'linear-gradient(160deg,#F7F5F1 0%,#EAF3EF 100%)', padding: 40, boxSizing: 'border-box',
      },
    };
  }
}
</script>
</body>
</html>
